name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master

  # Check regularly whether the deal.II base image changed
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # IMPORTANT: Docker repository names must be lowercase
  IMAGE_NAME: meltpooldg/adaflo

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          # Always check whether the deal.II base image changed
          pull: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=registry,ref=ghcr.io/meltpooldg/adaflo:buildcache
          cache-to: type=registry,ref=ghcr.io/meltpooldg/adaflo:buildcache,mode=max
